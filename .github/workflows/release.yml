name: Release

# Push a tag like v0.2.0 to publish a release with the server package (install.ps1) and the
# Windows client (install-client.ps1).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PowerShell scripts parse
        shell: pwsh
        run: ./.github/scripts/check-powershell.ps1

      - name: Daemon build and tests
        working-directory: daemon
        run: mvn -B package "-Drevision=${GITHUB_REF_NAME#v}"

      - name: MCP server tests
        working-directory: mcp
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"
          .venv/bin/pytest -q

      - name: Server package
        run: daemon/scripts/make-package.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-package
          path: dist/hfm-mcp-server-*.zip
          if-no-files-found: error

  client:
    uses: ./.github/workflows/client-windows.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.ps1 install-client.ps1 dist/
          cd dist
          sha256sum hfm-mcp-server-*.zip hfm-mcp-client-*.zip install.ps1 install-client.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            hfm-mcp-server-*.zip hfm-mcp-client-*.zip install.ps1 install-client.ps1 SHA256SUMS.txt
