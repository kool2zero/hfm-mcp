# HFM daemon configuration. Copy to daemon.properties and adjust.

# ---- HTTP server -----------------------------------------------------------------------------
# Bind to 127.0.0.1 if the MCP server runs on this machine. To accept connections from users'
# machines, bind to the server's address AND configure TLS: users' passwords are sent at login.
server.host=127.0.0.1
server.port=8765
server.threads=16

# Shared secret the MCP server sends as X-Api-Key (at least 16 characters). Prefer the
# HFM_DAEMON_API_KEY environment variable over putting it here.
server.apiKey=

# TLS (PKCS12 or JKS). Create one with:
#   keytool -genkeypair -alias hfm-daemon -keyalg RSA -keysize 2048 -validity 825 ^
#     -storetype PKCS12 -keystore hfm-daemon.p12 -dname "CN=<server fqdn>" -ext SAN=dns:<server fqdn>
# Password may come from HFM_DAEMON_KEYSTORE_PASSWORD instead.
server.tls.keystore=
server.tls.keystorePassword=
server.tls.keystoreType=PKCS12

# Only if TLS is terminated by a proxy in front of the daemon.
server.allowInsecureHttp=false

# ---- HFM -------------------------------------------------------------------------------------
# 'oracle' for the real HFM API, 'mock' for sample data.
backend=oracle
# Leave blank to let HFM pick an available cluster.
hfm.cluster=
# Application used when the login request does not name one.
hfm.defaultApplication=
hfm.locale=en_US

# ---- Sessions and limits ---------------------------------------------------------------------
session.idleTimeoutMinutes=30
session.maxSessions=100
metadata.cacheTtlMinutes=30
limits.maxCellsPerRequest=2000
limits.maxMembersPerRequest=2000

# Refuse logins for a user after this many bad passwords within the window, so a misconfigured
# client cannot lock the LDAP account.
auth.maxFailures=3
auth.failureWindowMinutes=15

# Most process units (entities x phases) one process-status request may read.
limits.maxProcessUnitsPerRequest=500

# ---- Actions: process control and consolidation ----------------------------------------------
# Off by default. When on, users can START / PROMOTE / SUBMIT / REJECT / APPROVE / PUBLISH process
# units and run consolidations/calculations - always as themselves, so their HFM security applies,
# and always previewed first. The MCP side must also set HFM_ENABLE_ACTIONS=true.
actions.enabled=false
# Which actions are allowed. Also available: APPROVE, PUBLISH, CONSOLIDATE_ALL_WITH_DATA,
# CONSOLIDATE_ALL, FORCE_CALCULATE, FORCE_TRANSLATE, and:
#   EXTRACT_DATA - Extended Analytics extract (flat file, or star schema / metadata into a DSN)
#   COPY_DATA    - ManageDataOM.copyData between slices (changes target data)
#   LOAD_DATA    - LoadExtractOM.loadData of a file in load.allowedDir (changes data; SCAN is dry-run)
actions.allowed=START,PROMOTE,SUBMIT,REJECT,CONSOLIDATE,CALCULATE,TRANSLATE
actions.maxUnitsPerRequest=100
# A previewed plan must be executed within this time, once.
actions.planTtlMinutes=10
# How long execute waits for a consolidation before returning its task ids to poll.
actions.waitSeconds=60
# Every action, per target, as JSON lines.
actions.auditLog=logs/hfm-actions-audit.log

# ---- Data extracts ----------------------------------------------------------------------------
# Flat-file extracts are unpacked here (one folder per extract). Use a share users can open,
# e.g. \\fileserver\hfm-extracts.
extract.exportDir=exports
# DSN for WAREHOUSE / METADATA extracts when the request names none (as configured in HFM).
extract.defaultDsn=
# Lines of each extracted file shown back to the model.
extract.previewLines=10

# ---- Data loads -------------------------------------------------------------------------------
# Only files inside this folder can be loaded (paths outside it are refused). Unset = no loads.
load.allowedDir=
# Most characters of HFM's load log returned to the model.
load.maxLogChars=8000

# ---- Oracle backend tuning -------------------------------------------------------------------
# POVs sent to HFM per getCellsDataAndStatus call.
oracle.cellBatchSize=500
# Retries (2s, 4s, 6s...) when HFM reports a server "is unavailable" mid-read.
oracle.connectionRetries=3

# Adds raw HFM fields to responses. Diagnostics only.
debug.includeRaw=false
